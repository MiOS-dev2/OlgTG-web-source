<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>OldTG</title>
<link rel="stylesheet" href="tgs.css">
</head>
<body class="theme-dark font-medium density-normal">

<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="img/oldtg.png" alt="OldTG" onerror="this.style.display='none'">
    </div>

    <h1 class="auth-title" id="auth-title">Вход</h1>
    <p class="auth-sub" id="auth-sub">Введите логин и пароль</p>

    <div id="fields-login">
      <div class="auth-field">
        <input type="text" id="in-login" placeholder="Логин" autocomplete="username" spellcheck="false" autocapitalize="off">
      </div>
      <div class="auth-field">
        <input type="password" id="in-pass" placeholder="Пароль" autocomplete="current-password">
      </div>
    </div>

    <div id="fields-register" style="display:none">
      <div class="auth-field">
        <input type="text" id="reg-login" placeholder="Логин (для входа)" autocomplete="username" spellcheck="false" autocapitalize="off">
      </div>
      <div class="auth-field">
        <input type="text" id="reg-username" placeholder="@username (для поиска)" spellcheck="false" autocapitalize="off">
        <div class="field-hint">Латиница, цифры, подчёркивание.</div>
      </div>
      <div class="auth-field">
        <input type="text" id="reg-name" placeholder="Имя" spellcheck="false" autocapitalize="words">
      </div>
      <div class="auth-field">
        <input type="password" id="reg-pass" placeholder="Пароль" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <input type="password" id="reg-pass2" placeholder="Повторите пароль" autocomplete="new-password">
      </div>
    </div>

    <button class="auth-btn" id="auth-submit">Войти</button>
    <div class="auth-error" id="auth-error"></div>

    <div class="auth-switch" id="auth-switch">Нет аккаунта? Зарегистрироваться</div>
  </div>
</div>

<div class="app" id="app">
  <div class="top-bar">
    <div class="menu-btn" id="menu-btn"><span></span><span></span><span></span></div>
    <div class="app-name">
      <img src="img/oldtg.png" alt="" onerror="this.style.display='none'">
      OldTG
    </div>
    <div class="user" id="user-area">
      <span class="uname" id="user-name"></span>
      <img id="user-ava" src="" alt="">
    </div>
  </div>

  <div class="main-block">
    <div class="left-col" id="left-col">
      <div class="left-tabs">
        <div class="tab is-active" data-tab="chats">Чаты</div>
        <div class="tab" data-tab="people">Люди</div>
        <div class="tab" data-tab="channels">Каналы</div>
      </div>

      <div class="left-content" id="tab-chats">
        <div class="search-wrap">
          <input id="chat-search" placeholder="Поиск чатов...">
        </div>
        <div class="list-scroll" id="chat-list"></div>
      </div>

      <div class="left-content is-hidden" id="tab-people">
        <div class="search-wrap">
          <input id="people-search" placeholder="Поиск по @username или имени...">
        </div>
        <div class="list-scroll" id="people-list"></div>
      </div>

      <div class="left-content is-hidden" id="tab-channels">
        <div class="search-wrap">
          <input id="channel-search" placeholder="Поиск каналов...">
        </div>
        <div class="list-scroll" id="channel-list"></div>
        <div style="padding:10px;">
          <button class="auth-btn" id="create-channel-btn" style="margin:0;">Создать канал</button>
        </div>
      </div>
    </div>

    <div class="right-col" id="right-col">
      <div class="conv-top" id="conv-top">
        <span class="empty-text">Выберите чат, чтобы начать переписку</span>
      </div>
      <div class="msgs" id="msgs">
        <div class="msgs-empty">
          <div class="big-icon">
            <img src="img/oldtg.png" alt="" onerror="this.style.display='none'">
          </div>
          <div class="big-text">OldTG</div>
        </div>
      </div>
      <div class="input-row is-hidden" id="input-row">
        <textarea id="msg-input" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" aria-label="Отправить"></button>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/settings.js"></script>
<script src="js/channels.js"></script>
<script>
var CFG = window.OLDTG_CONFIG;
var API_ACC = CFG.acc;
var API_MSG = CFG.msg;
var API_BOT = CFG.bot;
var POLL_MS = CFG.poll;
var DEFAULT_AVATAR = CFG.defaultAvatar;
var APP_VERSION = CFG.version;
var APP_AUTHOR = CFG.author;
var BOT_ID = CFG.botId;
var BOT_TOPIC = 'bot_oldtgs';

var DEFAULT_SETTINGS = {
  theme: 'dark',
  fontSize: 'medium',
  density: 'normal',
  chatBg: true,
  enterToSend: true,
  showUnreadBadge: true,
  notificationsSound: false,
  autoScroll: true,
  showTimestamps: true
};

var Settings = (function () {
  var saved = null;
  try { saved = localStorage.getItem('oldtg_settings'); } catch (e) {}
  var base = saved ? JSON.parse(saved) : {};
  var merged = {};
  for (var k in DEFAULT_SETTINGS) merged[k] = base[k] !== undefined ? base[k] : DEFAULT_SETTINGS[k];
  return {
    get: function (k) { return merged[k]; },
    set: function (k, v) {
      merged[k] = v;
      try { localStorage.setItem('oldtg_settings', JSON.stringify(merged)); } catch (e) {}
      applySettings();
    },
    all: function () { return merged; },
    reset: function () {
      merged = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      try { localStorage.setItem('oldtg_settings', JSON.stringify(merged)); } catch (e) {}
      applySettings();
    }
  };
})();

function applySettings() {
  document.body.className = '';
  document.body.classList.add('theme-' + Settings.get('theme'));
  document.body.classList.add('font-' + Settings.get('fontSize'));
  document.body.classList.add('density-' + Settings.get('density'));

  if (Settings.get('chatBg')) {
    document.documentElement.style.setProperty('--chat-bg-image', "url('img/chat.jpg')");
  } else {
    document.documentElement.style.setProperty('--chat-bg-image', 'none');
  }

  var msgs = document.getElementById('msgs');
  if (msgs) {
    if (Settings.get('chatBg')) msgs.classList.remove('no-bg');
    else msgs.classList.add('no-bg');
  }

  var themeColor = document.querySelector('meta[name="theme-color"]');
  if (themeColor) {
    var colors = { dark: '#17212b', light: '#ffffff', blue: '#253442' };
    themeColor.setAttribute('content', colors[Settings.get('theme')] || '#17212b');
  }
}

var S = {
  me: null,
  allUsers: [],
  chats: [],
  channels: [],
  activeChat: null,
  activeChannel: null,
  pollTimer: null,
  authMode: 'login',
  tab: 'chats',
  lastIds: {},
  unread: {},
  isMobile: false,
  chatsSig: '',
  msgsSig: '',
  peopleSig: '',
  channelsSig: '',
  channelPostsSig: ''
};

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function fmtDateShort(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var today = new Date();
  if (d.toDateString() === today.toDateString()) return fmtTime(iso);
  var m = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + m[d.getMonth()];
}

function fmtLastSeen(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return 'был(а) недавно';
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'был(а) только что';
  if (diff < 3600) return 'был(а) ' + Math.floor(diff / 60) + ' мин назад';
  if (diff < 86400) return 'был(а) ' + Math.floor(diff / 3600) + ' ч назад';
  return 'был(а) ' + fmtDateShort(iso);
}

function avatarOf(u) {
  if (u && u.avatar && u.avatar.length > 5) return u.avatar;
  return DEFAULT_AVATAR;
}

function normalizeUsername(s) {
  return String(s || '').trim().replace(/^@+/, '').toLowerCase();
}

function defaultUsername(login) {
  return String(login || '').toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 20);
}

function apiGet(url) {
  return fetch(url, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function apiPost(url, data) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function apiPut(url, data) {
  return fetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function checkMobile() {
  S.isMobile = window.innerWidth <= 768;
}

window.addEventListener('resize', function () {
  checkMobile();
  if (!S.isMobile) {
    $('left-col').classList.remove('is-hidden');
    $('right-col').classList.remove('is-hidden');
  } else {
    if (!S.activeChat && !S.activeChannel) {
      $('left-col').classList.remove('is-hidden');
      $('right-col').classList.add('is-hidden');
    }
  }
  S.chatsSig = '';
  S.msgsSig = '';
  S.peopleSig = '';
  S.channelsSig = '';
  if (S.me) {
    renderChats();
    if (S.tab === 'people') renderPeople();
    if (S.tab === 'channels') renderChannels();
    if (S.activeChat) renderMessages();
  }
});

$('auth-switch').onclick = function () {
  if (S.authMode === 'login') {
    S.authMode = 'register';
    $('auth-title').textContent = 'Регистрация';
    $('auth-sub').textContent = 'Создайте аккаунт OldTG';
    $('fields-login').style.display = 'none';
    $('fields-register').style.display = 'block';
    $('auth-submit').textContent = 'Зарегистрироваться';
    $('auth-switch').textContent = 'Уже есть аккаунт? Войти';
    $('auth-error').textContent = '';
  } else {
    S.authMode = 'login';
    $('auth-title').textContent = 'Вход';
    $('auth-sub').textContent = 'Введите логин и пароль';
    $('fields-login').style.display = 'block';
    $('fields-register').style.display = 'none';
    $('auth-submit').textContent = 'Войти';
    $('auth-switch').textContent = 'Нет аккаунта? Зарегистрироваться';
    $('auth-error').textContent = '';
  }
};

$('auth-submit').onclick = function () {
  if (S.authMode === 'login') doLogin();
  else doRegister();
};

['in-login','in-pass','reg-login','reg-username','reg-name','reg-pass','reg-pass2'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      if (S.authMode === 'login') doLogin();
      else doRegister();
    }
  });
});

function showAuthError(msg) { $('auth-error').textContent = msg; }

function setAuthLoading(loading) {
  var btn = $('auth-submit');
  btn.disabled = loading;
  if (loading) btn.textContent = S.authMode === 'login' ? 'Вход...' : 'Регистрация...';
  else btn.textContent = S.authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
}

function doLogin() {
  var login = $('in-login').value.trim();
  var pass = $('in-pass').value;
  showAuthError('');
  if (!login) { showAuthError('Введите логин'); return; }
  if (!pass) { showAuthError('Введите пароль'); return; }
  setAuthLoading(true);

  apiGet(API_ACC).then(function (users) {
    S.allUsers = Array.isArray(users) ? users : [];
    var found = S.allUsers.find(function (u) {
      if (u.login !== login) return false;
      try { return atob(u.password) === pass; }
      catch (e) { return u.password === pass; }
    });
    if (!found) { showAuthError('Неверный логин или пароль'); setAuthLoading(false); return; }
    if (!found.username) found.username = defaultUsername(found.login);

    S.me = {
      id: String(found.id),
      name: found.name || found.login,
      login: found.login,
      username: found.username,
      avatar: avatarOf(found),
      createdAt: found.createdAt || new Date().toISOString()
    };
    try { localStorage.setItem('oldtg_user', JSON.stringify(S.me)); } catch (e) {}
    startApp();
  }).catch(function (e) {
    showAuthError('Ошибка: ' + e.message);
    setAuthLoading(false);
  });
}

function doRegister() {
  var login = $('reg-login').value.trim();
  var username = normalizeUsername($('reg-username').value);
  var name = $('reg-name').value.trim();
  var pass = $('reg-pass').value;
  var pass2 = $('reg-pass2').value;

  showAuthError('');
  if (!login) { showAuthError('Введите логин'); return; }
  if (!username) { showAuthError('Введите @username'); return; }
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showAuthError('Username: 3-20 символов, латиница, цифры, _');
    return;
  }
  if (!name) { showAuthError('Введите имя'); return; }
  if (!pass) { showAuthError('Введите пароль'); return; }
  if (pass !== pass2) { showAuthError('Пароли не совпадают'); return; }

  setAuthLoading(true);

  apiGet(API_ACC).then(function (users) {
    S.allUsers = Array.isArray(users) ? users : [];
    if (S.allUsers.find(function (u) { return u.login === login; })) {
      showAuthError('Логин уже занят');
      setAuthLoading(false);
      return;
    }
    if (S.allUsers.find(function (u) { return normalizeUsername(u.username) === username; })) {
      showAuthError('Username @' + username + ' уже занят');
      setAuthLoading(false);
      return;
    }

    var newUser = {
      login: login,
      username: username,
      name: name,
      password: btoa(pass),
      avatar: DEFAULT_AVATAR,
      createdAt: new Date().toISOString()
    };
    return apiPost(API_ACC, newUser);
  }).then(function (created) {
    if (!created) return;
    S.me = {
      id: String(created.id),
      name: created.name || created.login,
      login: created.login,
      username: created.username,
      avatar: created.avatar || DEFAULT_AVATAR,
      createdAt: created.createdAt || new Date().toISOString()
    };
    try { localStorage.setItem('oldtg_user', JSON.stringify(S.me)); } catch (e) {}
    startApp();
  }).catch(function (e) {
    showAuthError('Ошибка: ' + e.message);
    setAuthLoading(false);
  });
}

(function () {
  var saved = null;
  try { saved = localStorage.getItem('oldtg_user'); } catch (e) {}
  if (!saved) return;
  try {
    S.me = JSON.parse(saved);
    apiGet(API_ACC).then(function (users) {
      S.allUsers = Array.isArray(users) ? users : [];
      var fresh = S.allUsers.find(function (u) { return String(u.id) === String(S.me.id); });
      if (fresh) {
        S.me.name = fresh.name || S.me.name;
        S.me.username = fresh.username || S.me.username;
        S.me.avatar = avatarOf(fresh);
        S.me.createdAt = fresh.createdAt || S.me.createdAt;
        try { localStorage.setItem('oldtg_user', JSON.stringify(S.me)); } catch (e) {}
      }
      startApp();
    }).catch(function () {
      startApp();
    });
  } catch (e) {}
})();

function startApp() {
  applySettings();
  checkMobile();
  $('auth-screen').style.display = 'none';
  $('app').classList.add('is-on');
  refreshTopBar();
  loadChats();
  loadBot();
  loadChannels();
  renderPeople();
  startPolling();

  if (S.isMobile) {
    $('right-col').classList.add('is-hidden');
  }

  handleDeepLink();
}


function handleDeepLink() {
  var hash = location.hash || '';
  if (!hash || hash.length < 2) return;


  var raw = hash.slice(1).replace(/^\/+/, '');

  raw = raw.replace(/^@/, '');

  var m = raw.match(/^([a-zA-Z0-9_]+)$/);
  if (!m) return;
  var uname = m[1].toLowerCase();

  var tryOpen = function (attempt) {
    if (attempt > 25) return;

    
    var ch = S.channels.find(function (c) {
      return String(c.username || '').toLowerCase() === uname;
    });
    if (ch) {
      var chTab = document.querySelector('.left-tabs .tab[data-tab="channels"]');
      if (chTab) chTab.click();
      openChannel(ch.id);
      return;
    }

    var u = S.allUsers.find(function (x) {
      return normalizeUsername(x.username) === uname;
    });
    if (u && String(u.id) !== String(S.me.id)) {
      startDirectChat(u.id);
      return;
    }

    
    setTimeout(function () { tryOpen(attempt + 1); }, 150);
  };

  tryOpen(0);
}

function startPolling() {
  if (S.pollTimer) clearInterval(S.pollTimer);
  S.pollTimer = setInterval(function () {
    if (document.hidden) return;
    loadChats(true);
    loadUsers(true);
    loadBot();
    loadChannels();
  }, POLL_MS);
}

function loadUsers(silent) {
  apiGet(API_ACC).then(function (users) {
    var arr = Array.isArray(users) ? users : [];
    if (arr.length !== S.allUsers.length) {
      S.allUsers = arr;
      S.peopleSig = '';
      if (S.tab === 'people') renderPeople();
      S.chats.forEach(function (c) {
        if (c.peer) {
          var fresh = arr.find(function (u) { return String(u.id) === String(c.peer.id); });
          if (fresh) c.peer = fresh;
        }
      });
    }
  }).catch(function () {});
}

function loadBot() {
  apiGet(API_BOT).then(function (msgs) {
    var arr = Array.isArray(msgs) ? msgs : [];
    var botMsgs = arr.filter(function (m) { return m.isBot || m.author === 'OldTG' || m.topicId === BOT_TOPIC; });
    S.botMessages = botMsgs;

    var chat = S.chats.find(function (c) { return c.id === BOT_TOPIC; });
    if (!chat) {
      chat = {
        id: BOT_TOPIC,
        title: 'OldTG',
        peer: {
          id: BOT_ID,
          name: 'OldTG',
          login: 'OldTG',
          username: 'oldtgs',
          avatar: 'img/oldtg.png',
          createdAt: new Date().toISOString()
        },
        messages: [],
        last: null,
        isBot: true,
        participants: new Set(['OldTG'])
      };
      S.chats.unshift(chat);
    }

    chat.messages = botMsgs.map(function (m) {
      return {
        id: m.id,
        name: m.name || 'OldTG',
        avatar: m.avatar || 'img/oldtg.png',
        author: m.author || 'OldTG',
        body: m.body,
        topicId: BOT_TOPIC,
        userId: BOT_ID,
        createdAt: m.createdAt,
        isBot: true
      };
    }).sort(function (a, b) {
      return new Date(a.createdAt) - new Date(b.createdAt);
    });

    chat.last = chat.messages.length ? chat.messages[chat.messages.length - 1] : null;
    chat.title = 'OldTG';

    S.chatsSig = '';
    S.msgsSig = '';
    renderChats();

    if (S.activeChat && S.activeChat.id === BOT_TOPIC) {
      var fresh = S.chats.find(function (c) { return c.id === BOT_TOPIC; });
      if (fresh) {
        S.activeChat = fresh;
        renderMessages();
      }
    }
  }).catch(function () {});
}

function loadChannels() {
  if (!window.Channels) return;
  window.Channels.all.then(function (list) {
    S.channels = Array.isArray(list) ? list : [];
    S.channelsSig = '';
    if (S.tab === 'channels') renderChannels();
  }).catch(function () {});
}

function refreshTopBar() {
  $('user-name').textContent = S.me.name;
  $('user-ava').src = S.me.avatar;
}

$('user-area').onclick = openProfileCard;

function logout() {
  try { localStorage.removeItem('oldtg_user'); } catch (e) {}
  if (S.pollTimer) clearInterval(S.pollTimer);
  location.reload();
}

document.querySelectorAll('.left-tabs .tab').forEach(function (tab) {
  tab.onclick = function () {
    document.querySelectorAll('.left-tabs .tab').forEach(function (t) { t.classList.remove('is-active'); });
    tab.classList.add('is-active');
    S.tab = tab.dataset.tab;
    $('tab-chats').classList.toggle('is-hidden', S.tab !== 'chats');
    $('tab-people').classList.toggle('is-hidden', S.tab !== 'people');
    $('tab-channels').classList.toggle('is-hidden', S.tab !== 'channels');
    if (S.tab === 'people') {
      S.peopleSig = '';
      renderPeople();
    } else if (S.tab === 'channels') {
      S.channelsSig = '';
      renderChannels();
    }
  };
});

function chatKeyOf(msg) {
  return String(msg.topicId != null ? msg.topicId : '0');
}

function makeTopicId(idA, idB) {
  var a = String(idA), b = String(idB);
  return a < b ? 'dm_' + a + '_' + b : 'dm_' + b + '_' + a;
}

function buildChats(messages) {
  var map = new Map();

  messages.forEach(function (m) {
    var key = chatKeyOf(m);
    if (!map.has(key)) {
      map.set(key, {
        id: key,
        title: m.title || 'Чат',
        messages: [],
        participants: new Set()
      });
    }
    var chat = map.get(key);
    chat.messages.push(m);
    if (m.author) chat.participants.add(m.author);
    if (m.userId) chat.participants.add(String(m.userId));
  });

  var chats = [];
  map.forEach(function (chat) {
    chat.messages.sort(function (a, b) {
      return new Date(a.createdAt) - new Date(b.createdAt);
    });
    var last = chat.messages[chat.messages.length - 1];

    var peer = null;
    chat.messages.forEach(function (m) {
      if (m.author && m.author !== S.me.login) {
        var u = S.allUsers.find(function (x) { return x.login === m.author; });
        if (u && !peer) peer = u;
      }
    });
    if (!peer && chat.id.indexOf('dm_') === 0) {
      var parts = chat.id.split('_');
      var myId = String(S.me.id);
      var otherId = parts[1] === myId ? parts[2] : parts[1];
      peer = S.allUsers.find(function (x) { return String(x.id) === String(otherId); }) || peer;
    }

    chat.peer = peer;
    chat.last = last;
    chat.title = peer ? (peer.name || peer.login) : chat.title;
    chats.push(chat);
  });

  chats.sort(function (a, b) {
    return new Date(b.last.createdAt) - new Date(a.last.createdAt);
  });
  return chats;
}

function loadChats(silent) {
  if (!silent && !S.chats.length) {
    $('chat-list').innerHTML = '<div class="loading-text">Загрузка чатов...</div>';
  }

  apiGet(API_MSG).then(function (msgs) {
    var arr = Array.isArray(msgs) ? msgs : [];
    var myId = String(S.me.id);

    var mine = arr.filter(function (m) {
      if (m.author === S.me.login) return true;
      if (String(m.userId) === myId) return true;
      var tid = String(m.topicId || '');
      if (tid.indexOf('dm_') === 0) {
        var parts = tid.split('_');
        if (parts[1] === myId || parts[2] === myId) return true;
      }
      return false;
    });

    var humanChats = buildChats(mine);

    var botChat = S.chats.find(function (c) { return c.id === BOT_TOPIC; });
    if (botChat) humanChats.unshift(botChat);

    S.chats = humanChats;

    S.chats.forEach(function (c) {
      if (c.isBot) return;
      var lastId = c.last ? String(c.last.id) : null;
      var prevId = S.lastIds[c.id];
      var lastFromMe = c.last && c.last.author === S.me.login;
      if (lastId && lastId !== prevId) {
        if (!lastFromMe) {
          S.unread[c.id] = (S.unread[c.id] || 0) + 1;
          if (Settings.get('notificationsSound')) playNotification();
        }
        S.lastIds[c.id] = lastId;
      }
    });

    if (S.activeChat) {
      S.unread[S.activeChat.id] = 0;
      var fresh = S.chats.find(function (c) { return c.id === S.activeChat.id; });
      if (fresh) {
        S.activeChat = fresh;
        renderMessages();
        renderConvTop();
      }
    }

    renderChats();
  }).catch(function (e) {
    if (!silent) {
      $('chat-list').innerHTML = '<div class="loading-text">Ошибка: ' + esc(e.message) + '</div>';
    }
  });
}

function renderChats() {
  var q = ($('chat-search').value || '').toLowerCase();
  var list = $('chat-list');

  var filtered = S.chats.filter(function (c) {
    if (!q) return true;
    var t = c.title.toLowerCase();
    var p = c.peer && c.peer.username ? ('@' + c.peer.username).toLowerCase() : '';
    return t.indexOf(q) >= 0 || p.indexOf(q) >= 0;
  });

  var sig = filtered.map(function (c) {
    return c.id + '|' + (c.last ? c.last.id : '') + '|' + (c.last ? c.last.body : '') + '|' + (S.unread[c.id] || 0) + '|' + (S.activeChat && S.activeChat.id === c.id ? '1' : '0');
  }).join(';');

  if (sig === S.chatsSig) return;
  S.chatsSig = sig;

  if (!filtered.length) {
    list.innerHTML = '<div class="loading-text">' +
      (S.chats.length ? 'Ничего не найдено' : 'Нет чатов. Найдите человека во вкладке Люди.') +
      '</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var c = filtered[i];
    var ava = c.peer ? avatarOf(c.peer) : DEFAULT_AVATAR;
    var lastText = c.last ? (c.last.body || '') : '';
    var prefix = (c.last && c.last.author === S.me.login) ? 'Вы: ' : '';
    var unread = S.unread[c.id] || 0;
    var unreadBadge = (Settings.get('showUnreadBadge') && unread > 0)
      ? '<span class="unread-badge">' + unread + '</span>'
      : '';
    var activeCls = (S.activeChat && S.activeChat.id === c.id) ? ' is-active' : '';
    html += '<div class="chat-row' + activeCls + '" data-id="' + esc(c.id) + '">' +
      '<img src="' + esc(ava) + '" alt="">' +
      '<div class="cr-body">' +
        '<div class="cr-top">' +
          '<span class="cr-name">' + esc(c.title) + '</span>' +
          '<span class="cr-time">' + fmtDateShort(c.last ? c.last.createdAt : '') + '</span>' +
        '</div>' +
        '<div class="cr-msg">' + esc(prefix + lastText) + '</div>' +
      '</div>' +
      unreadBadge +
    '</div>';
  }
  list.innerHTML = html;

  list.querySelectorAll('.chat-row').forEach(function (el) {
    el.onclick = function () { openChat(el.dataset.id); };
  });
}

function startDirectChat(peerId) {
  var peer = S.allUsers.find(function (u) { return String(u.id) === String(peerId); });
  if (!peer) return;
  var topicId = makeTopicId(S.me.id, peer.id);

  var existing = S.chats.find(function (c) { return c.id === topicId; });
  if (existing) {
    document.querySelector('.left-tabs .tab[data-tab="chats"]').click();
    openChat(existing.id);
    return;
  }

  var newChat = {
    id: topicId,
    title: peer.name || peer.login,
    peer: peer,
    messages: [],
    last: null,
    participants: new Set([S.me.login, peer.login])
  };
  S.chats.unshift(newChat);
  document.querySelector('.left-tabs .tab[data-tab="chats"]').click();
  S.chatsSig = '';
  renderChats();
  openChat(topicId);
}

function openChat(id) {
  var chat = S.chats.find(function (c) { return c.id === String(id); });
  if (!chat) return;
  S.activeChat = chat;
  S.activeChannel = null;
  S.unread[chat.id] = 0;
  S.chatsSig = '';
  S.msgsSig = '';
  renderChats();
  renderConvTop();
  renderMessages();
  $('input-row').classList.toggle('is-hidden', chat.isBot === true);
  if (!chat.isBot) $('msg-input').focus();

  if (S.isMobile) {
    $('right-col').classList.remove('is-hidden');
    $('left-col').classList.add('is-hidden');
  }
}

function closeChatMobile() {
  if (!S.isMobile) return;
  $('right-col').classList.add('is-hidden');
  $('left-col').classList.remove('is-hidden');
}

  }

  S.msgsSig = sig;

  if (!c.messages.length) {
    box.innerHTML = '<div class="msgs-empty">' +
      '<div class="big-icon"><img src="img/oldtg.png" alt="" onerror="this.style.display=\'none\'"></div>' +
      '<div class="big-text">' + (c.isBot ? 'OldTG всегда на связи' : 'Начните переписку') + '</div>' +
    '</div>';
    return;
  }

  var wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  var showTime = Settings.get('showTimestamps');

  var html = '';
  for (var i = 0; i < c.messages.length; i++) {
    var m = c.messages[i];
    var mine = !c.isBot && m.author === S.me.login;
    var cls = mine ? 'out' : 'in';
    var showAuthor = (!mine && m.name) ? '<div class="msg-author">' + esc(m.name) + '</div>' : '';
    var timeHtml = showTime ? '<div class="msg-time">' + fmtTime(m.createdAt) + '</div>' : '';
    html += '<div class="msg ' + cls + '">' +
      showAuthor +
      '<div class="msg-body">' + esc(m.body || '') + '</div>' +
      timeHtml +
    '</div>';
  }
  box.innerHTML = html;

  if (Settings.get('autoScroll') && (wasAtBottom || c.messages.length <= 1)) {
    box.scrollTop = box.scrollHeight;
  }
}

function sendMessage() {
  var input = $('msg-input');
  var body = input.value.trim();
  if (!body || !S.activeChat) return;

  var chat = S.activeChat;
  if (chat.isBot) return;

  var peer = chat.peer;
  if (!peer) return;

  if (body.charAt(0) === '/') {
    handleBotCommand(body);
    input.value = '';
    input.style.height = 'auto';
    return;
  }

  input.value = '';
  input.style.height = 'auto';

  var payload = {
    name: S.me.name,
    avatar: S.me.avatar,
    author: S.me.login,
    body: body,
    topicId: chat.id,
    title: peer.name || peer.login,
    userId: peer.id,
    createdAt: new Date().toISOString()
  };

  var optimistic = Object.assign({}, payload, { id: 'tmp-' + Date.now() });
  chat.messages.push(optimistic);
  chat.last = optimistic;
  S.msgsSig = '';
  S.chatsSig = '';
  renderMessages();
  renderChats();

  apiPost(API_MSG, payload).then(function (saved) {
    var idx = chat.messages.findIndex(function (m) { return m.id === optimistic.id; });
    if (idx >= 0 && saved && saved.id) chat.messages[idx] = saved;
    chat.last = chat.messages[chat.messages.length - 1];
    S.lastIds[chat.id] = String(chat.last.id);
    loadChats(true);
    setTimeout(function () { loadChats(true); }, 500);
  }).catch(function (e) {
    alert('Не удалось отправить: ' + e.message);
    var idx = chat.messages.findIndex(function (m) { return m.id === optimistic.id; });
    if (idx >= 0) chat.messages.splice(idx, 1);
    S.msgsSig = '';
    renderMessages();
  });
}

function handleBotCommand(cmd) {
  var chat = S.chats.find(function (c) { return c.id === BOT_TOPIC; });
  if (!chat) return;

  var cmdName = cmd.split(' ')[0].toLowerCase();

  var userMsg = {
    id: 'u-' + Date.now(),
    name: S.me.name,
    avatar: S.me.avatar,
    author: S.me.login,
    body: cmd,
    topicId: BOT_TOPIC,
    userId: S.me.id,
    createdAt: new Date().toISOString()
  };

  chat.messages.push(userMsg);
  S.msgsSig = '';
  if (S.activeChat && S.activeChat.id === BOT_TOPIC) renderMessages();

  var reply = '';
  if (cmdName === '/help') {
    reply = 'Доступные команды:\n' +
      '/help - список команд\n' +
      '/start - начать работу с ботом\n' +
      '/my - показать ваши данные (ник, юзернейм, логин)';
  } else if (cmdName === '/start') {
    reply = 'Добро пожаловать в OldTG!\n\nЯ — официальный бот OldTG. Здесь будут появляться важные новости об аккаунте и работе мессенджера.\n\nВведите /help для списка команд.';
  } else if (cmdName === '/my') {
    reply = 'Ваш профиль:\n\n' +
      'Имя: ' + (S.me.name || '—') + '\n' +
      'Username: @' + (S.me.username || '—') + '\n' +
      'Логин: ' + (S.me.login || '—') + '\n' +
      'ID: ' + (S.me.id || '—');
  } else {
    reply = 'Неизвестная команда. Введите /help для списка доступных команд.';
  }

  var botMsg = {
    id: 'b-' + Date.now(),
    name: 'OldTG',
    avatar: 'img/oldtg.png',
    author: 'OldTG',
    body: reply,
    topicId: BOT_TOPIC,
    userId: BOT_ID,
    createdAt: new Date().toISOString(),
    isBot: true
  };

  setTimeout(function () {
    chat.messages.push(botMsg);
    chat.last = botMsg;
    S.msgsSig = '';
    if (S.activeChat && S.activeChat.id === BOT_TOPIC) renderMessages();
    renderChats();
  }, 300);
}

function playNotification() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.value = 0.05;
    osc.start();
    setTimeout(function () { osc.stop(); ctx.close(); }, 120);
  } catch (e) {}
}

function wireProfileTab(bg) {
  var logoutBtn = bg.querySelector('#pf-logout');
  if (logoutBtn) {
    logoutBtn.onclick = function () { bg.remove(); logout(); };
  }

  var saveBtn = bg.querySelector('#pf-save');
  if (saveBtn) {
    saveBtn.onclick = function () {
      var err = bg.querySelector('#pf-err');
      var name = bg.querySelector('#pf-name').value.trim();
      var username = normalizeUsername(bg.querySelector('#pf-username').value);
      var avatar = bg.querySelector('#pf-avatar').value.trim();

      err.textContent = '';
      if (!name) { err.textContent = 'Введите имя'; return; }
      if (!username) { err.textContent = 'Введите username'; return; }
      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        err.textContent = 'Username: 3-20, латиница, цифры, _';
        return;
      }

      var taken = S.allUsers.find(function (u) {
        return String(u.id) !== String(S.me.id)
          && normalizeUsername(u.username) === username;
      });
      if (taken) { err.textContent = '@' + username + ' уже занят'; return; }

      var orig = S.allUsers.find(function (u) { return String(u.id) === String(S.me.id); });
      var updated = {
        name: name,
        username: username,
        avatar: avatar || S.me.avatar,
        login: S.me.login,
        password: orig ? orig.password : btoa(''),
        createdAt: orig ? orig.createdAt : new Date().toISOString()
      };

      apiPut(API_ACC + '/' + S.me.id, updated).then(function () {
        S.me.name = name;
        S.me.username = username;
        S.me.avatar = avatar || S.me.avatar;
        try { localStorage.setItem('oldtg_user', JSON.stringify(S.me)); } catch (e) {}
        refreshTopBar();
        if (orig) {
          orig.name = name;
          orig.username = username;
          orig.avatar = S.me.avatar;
        }
        S.chatsSig = '';
        S.msgsSig = '';
        S.peopleSig = '';
        renderChats();
        renderConvTop();
        bg.remove();
        openProfileCard();
      }).catch(function (e) {
        err.textContent = 'Ошибка: ' + e.message;
      });
    };
  }
}

  }
}

$('menu-btn').onclick = function () {
  if (S.me) {
    openSettings();
  } else {
    if (S.isMobile) {
      $('left-col').classList.remove('is-hidden');
      $('right-col').classList.add('is-hidden');
    } else {
      $('left-col').classList.toggle('is-hidden');
    }
  }
};

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.me) {
    loadChats(true);
    loadUsers(true);
    loadBot();
    loadChannels();
  }
});

applySettings();
checkMobile();
if (S.isMobile) {
  $('right-col').classList.add('is-hidden');
}

window.addEventListener('hashchange', function () {
  if (S.me) handleDeepLink();
});
</script>
</body>
</html>
